; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -D CORE_DEBUG_LEVEL=4
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.0

[env:c5]
board = esp32-c5-devkitc-1
upload_port = COM3
monitor_port = COM3
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PINO_BUZZER=0
    -D PINO_BOTAO=1
    -D DEVICE_NAME=\"esp-a\"
    -D DEVICE_KEY=\"ZXUgdPQgY29saGVuZG8gbyDzZGlvIHF1ZSBldSBtZXNtbyBwbGFudGVpLCBz428gbWluaGFzIGHn9WVz\"

[env:devkitv1]
board = esp32doit-devkit-v1
upload_port = COM4
monitor_port = COM4
build_flags =
    ${env.build_flags}
    -D PINO_BUZZER=18
    -D PINO_BOTAO=19
    -D DEVICE_NAME=\"esp-b\"
    -D DEVICE_KEY=\"bm8gbGltaXRlIGFwcmVuZGkgcXVlIGEgcGF6IHPzIHZlbSBhcPNzIHVtYSBndWVycmE\"
